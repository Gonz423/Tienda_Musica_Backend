spring.application.name=producto-service
server.port=8083

# Base de datos independiente para Catalogo e Inventario
spring.datasource.url=${PRODUCTOS_DB_URL:jdbc:mysql://localhost:3306/tienda_musica_productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${PRODUCTOS_DB_USER:root}
spring.datasource.password=${PRODUCTOS_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Seguridad JWT (misma clave para validar tokens emitidos por auth-service)
app.jwt.secret=${JWT_SECRET:iuwyeriuwyriweiw123456789012345678901234567890!}
app.jwt.issuer=tienda-musica-auth
