# Perfil de producción (EC2). Se activa con --spring.profiles.active=prod
# Los secretos llegan como variables de entorno desde /etc/tienda-musica/metrica-service.env (EnvironmentFile de systemd)

# Solo escucha en la interfaz local: Nginx es el único punto público
server.address=127.0.0.1
server.port=8085

spring.datasource.url=${METRICAS_DB_URL}
spring.datasource.username=${METRICAS_DB_USER}
spring.datasource.password=${METRICAS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=tienda-musica-auth
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Comunicación entre microservicios (siempre por la interfaz local)
app.servicios.pedido-url=${PEDIDO_URL:http://127.0.0.1:8084}
app.servicios.producto-url=${PRODUCTO_URL:http://127.0.0.1:8083}
