# Nginx: único punto HTTP público. Publica React y enruta cada microservicio.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/tienda-musica;
    index index.html;
    client_max_body_size 5m;

    # auth-service: /api/auth-service/** -> 127.0.0.1:8081/api/**
    location /api/auth-service/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # usuario-service: /api/usuario-service/** -> 127.0.0.1:8082/api/**
    location /api/usuario-service/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # producto-service: /api/producto-service/** -> 127.0.0.1:8083/api/**
    location /api/producto-service/ {
        proxy_pass http://127.0.0.1:8083/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # pedido-service: /api/pedido-service/** -> 127.0.0.1:8084/api/**
    location /api/pedido-service/ {
        proxy_pass http://127.0.0.1:8084/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # metrica-service: /api/metrica-service/** -> 127.0.0.1:8085/api/**
    location /api/metrica-service/ {
        proxy_pass http://127.0.0.1:8085/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Recursos de Vite con hash en el nombre: se pueden cachear
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Fallback de SPA: React Router resuelve /catalogo, /admin/..., etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
