# Perfil de producción (EC2). Se activa con --spring.profiles.active=prod
# Los secretos llegan como variables de entorno desde /etc/tienda-musica/auth-service.env (EnvironmentFile de systemd)

# Solo escucha en la interfaz local: Nginx es el único punto público
server.address=127.0.0.1
server.port=8081

spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=tienda-musica-auth
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.jwt.expiration-ms=3600000
