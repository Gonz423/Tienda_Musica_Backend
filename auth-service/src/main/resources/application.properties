spring.application.name=auth-service
server.port=8081

# Base de datos independiente para Autenticación
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/tienda_musica_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${AUTH_DB_USER:root}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Seguridad JWT
app.jwt.secret=${JWT_SECRET:iuwyeriuwyriweiw123456789012345678901234567890!}
app.jwt.issuer=tienda-musica-auth
app.jwt.expiration-ms=86400000
