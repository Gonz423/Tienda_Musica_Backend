spring.application.name=usuario-service
server.port=8082

# Comparte la BD de identidad con auth-service: asi una desactivacion o cambio de rol
# hecho aqui se aplica de inmediato en el login y en la renovacion del JWT.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_musica_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (mismo secreto compartido, validacion sin consultar auth-service)
app.jwt.secret=${JWT_SECRET:iuwyeriuwyriweiw123456789012345678901234567890!}
app.jwt.issuer=tienda-musica-auth
app.jwt.expiration-ms=86400000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
