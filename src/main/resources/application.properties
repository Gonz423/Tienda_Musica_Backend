spring.application.name=tienda_musica_backend
server.port=8080

# Configuracion de conexion a MySQL local (identica al patron de conecta-cultura-completo)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_musica_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seguridad JWT
app.jwt.secret=${JWT_SECRET:iuwyeriuwyriweiw123456789012345678901234567890!}
app.jwt.issuer=tienda-musica-auth
app.jwt.expiration-ms=86400000
